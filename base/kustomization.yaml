apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: course-catalog

resources:
  - mariadb.yaml
  - web.yaml

configMapGenerator:
  - name: course-catalog
    literals:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USER=root
      - DB_NAME=simplePythonFlask

apiVersion: v1
kind: Secret
metadata:
  name: course-catalog
type: Opaque
stringData:
  # ATENCAO: chave em texto puro somente para o laboratorio
  secret-key: troque-esta-chave-no-ambiente-real
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: course-catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: course-catalog
    spec:
      securityContext:
        runAsNonRoot: true
      initContainers:
        # Cria o banco, as tabelas e a carga inicial. Aguarda o MariaDB ficar disponivel.
        - name: init-db
          image: course-catalog
          command:
            - sh
            - -c
            - until python3 create_db.py; do echo "Aguardando o banco de dados..."; sleep 5; done
          envFrom:
            - configMapRef:
                name: course-catalog
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb
                  key: root-password
      containers:
        - name: web
          image: course-catalog
          envFrom:
            - configMapRef:
                name: course-catalog
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb
                  key: root-password
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: course-catalog
                  key: secret-key
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: course-catalog
spec:
  selector:
    app.kubernetes.io/name: course-catalog
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: course-catalog
spec:
  ingressClassName: traefik
  rules:
    # O host e definido em cada overlay
    - host: course-catalog.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: course-catalog
                port:
                  name: http
